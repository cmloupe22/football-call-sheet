<meta name="robots" content="noindex, nofollow, noarchive">
<title>Grace Prep Call Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#EDEFEA; --card:#FAFBF7; --sunk:#E1E5DD; --rule:#CCD2C9;
    --ink:#121810; --ink-2:#47513F; --ink-3:#77817A;
    --run:#BE5A2E; --pass:#0F7DA8;
    --run-soft:#F5E2D7; --pass-soft:#D7E9F2;
    --stop:#8A2F1E; --stop-soft:#F3DDD7;
    --mute:#6B7369; --mute-soft:#E4E7E1;
    --grid:#D6DBD3; --base:#8A938A;
    --display:"Saira Condensed","Arial Narrow",sans-serif;
    --body:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0B100D; --card:#141A16; --sunk:#090E0B; --rule:#252F29;
      --ink:#E9EEE8; --ink-2:#A6B0A6; --ink-3:#717B73;
      --run:#D4703E; --pass:#3E9BCC;
      --run-soft:#2C1A11; --pass-soft:#0E2430;
      --stop:#DE7C63; --stop-soft:#2E1712;
      --mute:#8B958B; --mute-soft:#1A211C;
      --grid:#222B25; --base:#6D776E;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B100D; --card:#141A16; --sunk:#090E0B; --rule:#252F29;
    --ink:#E9EEE8; --ink-2:#A6B0A6; --ink-3:#717B73;
    --run:#D4703E; --pass:#3E9BCC;
    --run-soft:#2C1A11; --pass-soft:#0E2430;
    --stop:#DE7C63; --stop-soft:#2E1712;
    --mute:#8B958B; --mute-soft:#1A211C;
    --grid:#222B25; --base:#6D776E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:24px 56px}

  /* ---------- masthead ---------- */
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;
         gap:10px 24px;border-bottom:3px solid var(--ink);padding-bottom:12px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--ink-3);margin:0 0 3px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,60px);line-height:.9;
     margin:0;text-transform:uppercase;letter-spacing:-.005em}
  .opp{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;
       line-height:1.7;flex:none}

  /* ---------- the call ---------- */
  .call{margin:22px 0 0;border:2px solid var(--ink);border-radius:4px;overflow:hidden;
        background:var(--card)}
  .callhead{background:var(--ink);color:var(--ground);padding:7px 16px;
            font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .steps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch}
  @media (max-width:720px){ .steps{grid-template-columns:1fr} }
  .step{padding:18px 16px 16px;min-width:0}
  .steplab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--ink-3);margin-bottom:7px}
  .stepbig{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.92;
           font-size:clamp(26px,4.4vw,40px);letter-spacing:-.005em}
  .stepbig.run{color:var(--run)}
  .pcard{display:block;width:100%;max-width:330px;height:auto;margin:10px 0 4px}
  .pc-los{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 4}
  .pc-dot{stroke:var(--card);stroke-width:1.5}
  .pc-ol{fill:var(--ink-2)}
  .pc-qb{fill:var(--ink)}
  .pc-rb{fill:var(--run)}
  .pc-wr{fill:var(--ink-3)}
  .pc-te{fill:var(--pass)}
  .pc-lab{font-family:var(--mono);font-size:8px;font-weight:600;fill:var(--card)}
  .pc-gap{font-family:var(--mono);font-size:9px;font-weight:600;fill:var(--run)}
  .pc-bgap{fill:var(--run);opacity:.14}
  .pccap{font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1.45;
         margin:0 0 2px}
  .gfpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .gfcell{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:3px;
          padding:12px 14px 10px}
  .gfcell svg{display:block;width:100%;height:auto;margin:2px 0 4px}
  .gfhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
          gap:4px 12px;margin-bottom:2px}
  .gfhead b{font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase}
  .gfn{font-family:var(--mono);font-size:11px;white-space:nowrap}
  .gfn.run{color:var(--run)} .gfn.pass{color:var(--pass)}
  .gf-los{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:6 5}
  .gf-ol{fill:var(--ink-2);stroke:var(--card);stroke-width:1.5}
  .gf-qb{fill:var(--ink);stroke:var(--card);stroke-width:1.5}
  .gf-rb{fill:var(--ink-2);stroke:var(--card);stroke-width:1.5}
  .gf-gap{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink-3)}
  .gf-gap.hot{fill:var(--ink);font-size:14px}
  .gf-arrow{cursor:default}
  .gfnote{margin-top:9px}
  .compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .cmp{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px}
  .cmphead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
           gap:6px 12px;margin-bottom:2px}
  .cmphead b{font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase;
             line-height:1.1}
  .cmprate{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
  .cmprate.run{color:var(--run)}
  .cmprate.flat{color:var(--ink-3)}
  .stepsub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:7px;
           line-height:1.6;font-variant-numeric:tabular-nums}
  .arrow{display:flex;align-items:center;justify-content:center;padding:0 4px;
         color:var(--ink-3);font-size:26px;line-height:1}
  @media (max-width:720px){
    .arrow{padding:0 16px 6px;justify-content:flex-start;transform:rotate(90deg);
           transform-origin:left center;height:22px}
    .step{padding-top:10px}
    .step:first-child{padding-top:18px}
  }
  .kicker{border-top:1px solid var(--rule);background:var(--sunk);padding:11px 16px;
          font-size:14px;color:var(--ink-2)}
  .kicker b{color:var(--ink)}

  /* ---------- sections ---------- */
  h2.sec{font-family:var(--display);font-size:clamp(23px,3.6vw,30px);text-transform:uppercase;
         margin:36px 0 3px;letter-spacing:.01em}
  p.lede{margin:0 0 15px;color:var(--ink-2);max-width:68ch}

  .legend{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin:0 0 11px;
          font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
  .key{display:flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:2px;flex:none}
  .sw.r{background:var(--run)} .sw.p{background:var(--pass)}
  .sw.b{background:transparent;border-left:2px dashed var(--base);width:2px;border-radius:0;
        height:13px}

  /* ---------- trigger rows ---------- */
  .trig{background:var(--card);border:1px solid var(--rule);border-radius:3px;
        margin-bottom:9px;overflow:hidden;break-inside:avoid}
  .trig.top{border-color:var(--run);border-width:1px 1px 1px 4px}
  .trow{display:grid;grid-template-columns:minmax(150px,1.05fr) minmax(190px,1.9fr) auto;
        gap:8px 16px;align-items:center;padding:12px 15px}
  @media (max-width:720px){ .trow{grid-template-columns:1fr;align-items:start} }
  .tname{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;
         line-height:1.02;min-width:0}
  .tdesc{font-family:var(--body);font-size:12px;text-transform:none;color:var(--ink-3);
         font-weight:400;display:block;margin-top:2px;letter-spacing:0}
  .tchart svg{display:block;width:100%;height:auto;overflow:visible}
  .tchart svg text{font-family:var(--mono);font-size:9px}
  .tchart svg text.tick{fill:var(--ink-3)}
  .tchart svg text.basel{fill:var(--base)}
  .tnums{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
         white-space:nowrap}
  @media (max-width:720px){ .tnums{text-align:left} }
  .tbig{font-size:27px;font-weight:600;color:var(--run);line-height:1}
  .tsmall{font-size:10.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.03em}
  .tfoot{border-top:1px solid var(--rule);padding:7px 15px 9px;background:var(--sunk);
         font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.65}
  .tfoot code{color:var(--ink-2);word-break:break-word}
  .tfoot .lbl{letter-spacing:.09em;text-transform:uppercase;font-size:9.5px}
  details.film{margin-top:6px}
  details.film summary{cursor:pointer;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
                       color:var(--ink-2)}
  details.film summary:hover{color:var(--ink)}
  .films{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px;
         margin-top:9px}
  .film{border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--card)}
  .film img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
  .film figcaption{padding:4px 6px;font-size:9px;color:var(--ink-3);line-height:1.4}
  .film figcaption b{display:block;color:var(--ink);font-size:10px}

  /* ---------- gap chart ---------- */
  .gapbox{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:15px;
          break-inside:avoid}
  .gapbox svg{display:block;width:100%;height:auto;overflow:visible}
  .gapbox svg text{font-family:var(--mono)}
  .gapbox svg text.cat{font-size:11px;fill:var(--ink);font-weight:600}
  .gapbox svg text.val{font-size:10px;fill:var(--ink-2)}
  .gapbox svg text.tick{font-size:9px;fill:var(--ink-3)}
  .gapnote{margin:12px 0 0;font-size:13.5px;color:var(--ink-2)}
  .gapnote b{color:var(--ink)}

  /* ---------- don't coach ---------- */
  .nots{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:10px}
  .not{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--stop);
       border-radius:3px;padding:12px 14px;break-inside:avoid}
  .not h3{font-family:var(--display);font-size:19px;text-transform:uppercase;margin:0 0 3px;
          line-height:1.05}
  .not .verdict{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:600;
                letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:2px;
                background:var(--stop-soft);color:var(--stop);margin-bottom:7px}
  .not p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
  .not .b{display:block;margin-top:6px;font-family:var(--mono);font-size:10.5px;
          color:var(--ink-3)}

  /* ---------- caveats ---------- */
  .cav{margin-top:14px;background:var(--card);border:1px solid var(--rule);border-radius:3px;
       padding:14px 16px;break-inside:avoid}
  .cav h3{font-family:var(--display);font-size:19px;text-transform:uppercase;margin:0 0 8px}
  .cav ul{margin:0;padding-left:17px;color:var(--ink-2);font-size:13.5px}
  .cav li{margin-bottom:6px} .cav li:last-child{margin-bottom:0}
  .cav b{color:var(--ink)}

  /* ---------- table ---------- */
  .tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--card);
             margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule)}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
     color:var(--ink-3);font-weight:500}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  tr:last-child td{border-bottom:0}

  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--ground);
       font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:3px;z-index:40;
       max-width:230px;line-height:1.45}
  .loading{padding:50px 20px;text-align:center;color:var(--ink-3);font-family:var(--mono)}
  :focus-visible{outline:2px solid var(--run);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- print: a coach may bring this to the box ---------- */
  @media print{
    :root{--ground:#fff;--card:#fff;--sunk:#f4f4f2;--rule:#bbb;--ink:#000;--ink-2:#333;
          --ink-3:#666;--grid:#ddd;--base:#888}
    body{background:#fff;font-size:11pt}
    .wrap{max-width:none;padding:0}
    h2.sec{margin-top:20px;page-break-after:avoid}
    .trig,.not,.cav,.gapbox,.call{page-break-inside:avoid}
    details.film{display:none}
    .tip{display:none}
    .printonly{display:block!important}
  }
  .printonly{display:none}
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Defensive call sheet &middot; prepared from 3 games of tagged film</p>
      <h1>Grace Prep Call Sheet</h1>
    </div>
    <p class="opp">OPPONENT: GRACE PREP ACADEMY<br>102 offensive snaps charted<br>
      <span id="stamp"></span></p>
  </header>

  <div id="app" class="loading">Loading the sheet&hellip;</div>
</div>

<script>
(function(){
  const app = document.getElementById('app');
  fetch('gameplan.json').then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(build).catch(e => { app.textContent = 'Could not load gameplan.json (' + e + ')'; });

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pc = v => Math.round(v * 100) + '%';

  // ---- run-rate strip: one 0-100% scale, base rate marked, CI as a whisker -------
  const W = 340, H = 42, PL = 4, PR = 4;
  function runStrip(t, base){
    const x = v => PL + v * (W - PL - PR);
    const y = 17, r = t.run;
    const ticks = [0, 0.5, 1];
    const games = Object.entries(t.run_per_game || {}).map(([g, d]) =>
      `<circle cx="${x(d.rate).toFixed(1)}" cy="${y + 13}" r="3.6" fill="var(--run)"
         stroke="var(--card)" stroke-width="1.5"
         data-tip="Game ${g}: ${pc(d.rate)} run on ${d.n} plays"></circle>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img"
        aria-label="${pc(r.rate)} run, 95% interval ${pc(r.lo)} to ${pc(r.hi)}, base rate ${pc(base)}">
      ${ticks.map(v => `<line x1="${x(v).toFixed(1)}" y1="${y-9}" x2="${x(v).toFixed(1)}" y2="${y+5}"
          stroke="var(--grid)" stroke-width="1"></line>`).join('')}
      ${ticks.map(v => `<text class="tick" x="${x(v).toFixed(1)}" y="${H-2}"
          text-anchor="${v===0?'start':v===1?'end':'middle'}">${v*100}%</text>`).join('')}
      <line x1="${x(base).toFixed(1)}" y1="${y-11}" x2="${x(base).toFixed(1)}" y2="${y+20}"
        stroke="var(--base)" stroke-width="1.5" stroke-dasharray="3 3"></line>
      <line x1="${x(r.lo).toFixed(1)}" y1="${y}" x2="${x(r.hi).toFixed(1)}" y2="${y}"
        stroke="var(--run)" stroke-width="1.5" opacity=".5"></line>
      <rect x="${x(0).toFixed(1)}" y="${y-4}" width="${(x(r.rate)-x(0)).toFixed(1)}" height="8"
        rx="4" fill="var(--run)"
        data-tip="${r.k} of ${r.n} were runs — ${pc(r.rate)}, 95% CI ${pc(r.lo)}–${pc(r.hi)}"></rect>
      ${games}
    </svg>`;
  }

  // ---- gap chart: where the ball actually goes, drawn on the line ----------------
  // A bar chart of gap letters makes a coach translate A/B/C/D back into positions on
  // the line. Drawing it on the line skips that step: arrow weight is the share of
  // plays through that gap. Both sides are drawn at equal weight on purpose -- the
  // gap tag says which gap, never which side, and direction tested as a coin flip.
  const GW = 440, GH = 200, G_LOS = 112, G_MID = 220, G_OL = 28;
  function gapField(spread, total, tone, label){
    const map = Object.fromEntries(spread);
    // Gap centres stepping outward from the ball, in half-OL-spacing units.
    const gaps = [['A', 0.5], ['B', 1.5], ['C', 2.5], ['D', 3.5], ['E-Alley', 4.6]];
    const ol = [-2,-1,0,1,2].map(i => G_MID + i * G_OL);
    const origin = [G_MID, G_LOS + 62];
    const maxShare = Math.max(...gaps.map(([g]) => (map[g] || 0) / total), 0.01);

    const arrows = gaps.flatMap(([g, step]) => {
      const share = (map[g] || 0) / total;
      if (share <= 0) return [];
      const w = 2.5 + 15 * (share / maxShare);
      return [-1, 1].map(side => {
        const gx = G_MID + side * step * G_OL;
        const sx = G_MID + side * step * G_OL * 0.30;
        const ex = gx + side * step * G_OL * 0.16;
        const ey = G_LOS - 40;
        const ang = Math.atan2(ey - (G_LOS + 46), ex - sx);
        const hl = 8 + w * 0.5;
        const head = [
          [ex + Math.cos(ang) * hl, ey + Math.sin(ang) * hl],
          [ex + Math.cos(ang + 2.5) * hl, ey + Math.sin(ang + 2.5) * hl],
          [ex + Math.cos(ang - 2.5) * hl, ey + Math.sin(ang - 2.5) * hl],
        ].map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
        return `<g class="gf-arrow" data-tip="${map[g]} of ${total} ${label} hit ${g} gap — ${pc(share)}${
              side === -1 ? ' (either side; the tag does not record which)' : ''}">
          <line x1="${sx.toFixed(1)}" y1="${(G_LOS + 46).toFixed(1)}"
            x2="${ex.toFixed(1)}" y2="${ey}" stroke="var(--${tone})"
            stroke-width="${w.toFixed(1)}" stroke-linecap="round" opacity=".88"></line>
          <polygon points="${head}" fill="var(--${tone})" opacity=".88"></polygon>
        </g>`;
      });
    }).join('');

    const gapLabels = gaps.flatMap(([g, step]) => [-1, 1].map(side => {
      const gx = G_MID + side * step * G_OL;
      const share = (map[g] || 0) / total;
      return `<text class="gf-gap${share >= 0.25 ? ' hot' : ''}" x="${gx.toFixed(1)}"
        y="${G_LOS + 26}" text-anchor="middle">${g === 'E-Alley' ? 'E' : g}</text>`;
    })).join('');

    return `<svg viewBox="0 0 ${GW} ${GH}" role="img"
        aria-label="${label} by gap, drawn on the offensive line. ${
          gaps.filter(([g]) => map[g]).map(([g]) =>
            `${g}: ${pc((map[g]||0)/total)}`).join(', ')}. Arrows are drawn on both sides
          because the tag records the gap, not the side.">
      <line class="gf-los" x1="14" y1="${G_LOS}" x2="${GW - 14}" y2="${G_LOS}"></line>
      ${arrows}
      ${ol.map(x => `<circle class="gf-ol" cx="${x}" cy="${G_LOS}" r="8"></circle>`).join('')}
      <circle class="gf-qb" cx="${G_MID}" cy="${G_LOS + 30}" r="7"></circle>
      <circle class="gf-rb" cx="${origin[0]}" cy="${origin[1]}" r="7"></circle>
      ${gapLabels}
    </svg>`;
  }

  function gapChart(gap){
    const rTot = gap.run_spread.reduce((a,[,v]) => a + v, 0);
    const pTot = gap.pass_spread.reduce((a,[,v]) => a + v, 0);
    return `<div class="gfpair">
      <figure class="gfcell">
        <figcaption class="gfhead"><b>Where the runs go</b>
          <span class="gfn run">${rTot} tagged runs</span></figcaption>
        ${gapField(gap.run_spread, rTot, 'run', 'runs')}
        <p class="pccap">Four of five runs hit B gap &mdash; between guard and tackle.
          Thickness is the share of runs.</p>
      </figure>
      <figure class="gfcell">
        <figcaption class="gfhead"><b>Where the passes go</b>
          <span class="gfn pass">${pTot} tagged passes</span></figcaption>
        ${gapField(gap.pass_spread, pTot, 'pass', 'passes')}
        <p class="pccap">Passes work outside &mdash; D gap and the alley. B gap is nearly
          empty, which is what makes the split readable.</p>
      </figure>
    </div>
    <p class="pccap gfnote">Both sides are drawn at the same weight deliberately. The
      breakdown records which gap, never which side, and direction tested as a coin flip
      across 108 rules &mdash; so this shows where, not which way.</p>`;
  }

  // ---- alignment card ----------------------------------------------------------
  // Drawn from the personnel code, which is a count, not a picture: first digit is
  // running backs, second is tight ends, the rest are receivers. The data confirms
  // the convention holds here -- 32 personnel is always Wishbone, 00 always Empty.
  // Line spacing and the backfield are therefore exact; receiver splits vary snap to
  // snap and are drawn indicatively, which the caption says out loud.
  const CARD_W = 330, CARD_H = 172, LOS_Y = 74, MID = 165, OL_GAP = 23;
  function playCard(pers, backfield){
    const rb = +String(pers)[0], te = +String(pers)[1];
    const wr = Math.max(0, 5 - rb - te);
    const ol = [-2,-1,0,1,2].map(i => MID + i * OL_GAP);
    const dot = (x, y, cls, lab) =>
      `<circle class="pc-dot ${cls}" cx="${x.toFixed(1)}" cy="${y}" r="7"></circle>` +
      (lab ? `<text class="pc-lab" x="${x.toFixed(1)}" y="${y + 3.4}"
                text-anchor="middle">${lab}</text>` : '');

    // B gap sits between guard and tackle, on both sides: direction had no tell,
    // so neither side is favoured here.
    const bGaps = [(ol[0] + ol[1]) / 2, (ol[3] + ol[4]) / 2].map(x =>
      `<rect class="pc-bgap" x="${(x - 9).toFixed(1)}" y="${LOS_Y - 26}"
         width="18" height="52" rx="3"></rect>
       <text class="pc-gap" x="${x.toFixed(1)}" y="${LOS_Y - 32}"
         text-anchor="middle">B</text>`).join('');

    // Backs: exact placement from the backfield tag, and exactly as many as the
    // personnel code says -- an empty set draws none.
    const qbY = LOS_Y + 26;
    const side = backfield === 'LEFT' ? -1 : 1;
    const slots = backfield === 'PISTOL'
        ? [[MID, qbY + 30, 'RB'], [MID - 26, qbY + 30, 'RB'], [MID + 26, qbY + 30, 'RB']]
      : backfield === 'WISHBONE'
        ? [[MID, qbY + 26, 'FB'], [MID - 34, qbY + 46, 'RB'], [MID + 34, qbY + 46, 'RB']]
      : (backfield === 'ONE BACK' || rb === 1)
        ? [[MID, qbY + 28, 'RB'], [MID + 32, qbY + 12, 'RB'], [MID - 32, qbY + 12, 'RB']]
        : [[MID + side * 30, qbY + 14, 'RB'], [MID - side * 14, qbY + 32, 'RB'],
           [MID + side * 4, qbY + 48, 'RB']];
    const backs = slots.slice(0, rb);

    const wrX = [MID - 138, MID - 112, MID + 112, MID + 138, MID - 86];
    const recv = Array.from({length: wr}, (_, i) =>
      dot(wrX[i], LOS_Y, 'pc-wr', 'W')).join('');
    const tight = Array.from({length: te}, (_, i) =>
      dot(ol[4] + 24 + i * 22, LOS_Y, 'pc-te', 'Y')).join('');

    return `<svg class="pcard" viewBox="0 0 ${CARD_W} ${CARD_H}" role="img"
        aria-label="${rb} backs, ${te} tight ends, ${wr} receivers, backfield ${backfield || 'varies'};
                    B gaps highlighted between guard and tackle on both sides">
      <line class="pc-los" x1="6" y1="${LOS_Y}" x2="${CARD_W - 6}" y2="${LOS_Y}"></line>
      ${bGaps}
      ${ol.map(x => dot(x, LOS_Y, 'pc-ol', '')).join('')}
      ${tight}${recv}
      ${dot(MID, qbY, 'pc-qb', 'Q')}
      ${backs.map(([x, y, l]) => dot(x, y, 'pc-rb', l)).join('')}
    </svg>`;
  }

  function build(g){
    const plays = g.plays;
    const all = Object.values(plays);
    const base = all.filter(p => p.type === 'Run').length / all.length;
    document.getElementById('stamp').textContent =
      'Base run rate ' + pc(base) + ' · ' + all.length + ' plays';

    // Most frequent looks first: on a sideline, how often you face it matters.
    const trigs = [...g.triggers].sort((a,b) => b.run.n - a.run.n);
    const falcon = g.triggers.find(t => t.name === 'FALCON');
    const p20    = g.triggers.find(t => t.name === '20 personnel');
    const fbr    = g.triggers.find(t => t.name === 'FALCON, back right');

    const hudl = clips => [1,2,3].map(gm => {
      const inG = clips.map(c => plays[String(c)]).filter(p => p && p.game === gm);
      if(!inG.length) return '';
      return `G${gm} <code>#${inG.map(p => esc(p.playno || '?')).join(', #')}</code>`;
    }).filter(Boolean).join(' &nbsp;&middot;&nbsp; ');

    const trigRow = (t, i) => `<article class="trig${i===0?' top':''}">
      <div class="trow">
        <div class="tname">${esc(t.name)}<span class="tdesc">${esc(t.desc)}</span></div>
        <div class="tchart">${runStrip(t, base)}</div>
        <div class="tnums">
          <div class="tbig">${pc(t.run.rate)}</div>
          <div class="tsmall">RUN &middot; ${t.run.k}/${t.run.n} snaps</div>
          <div class="tsmall">${pc(t.bgap_of_runs.rate)} of those to B gap</div>
        </div>
      </div>
      <div class="tfoot">
        <span class="lbl">Film</span> ${hudl(t.clips)}
        &nbsp;&middot;&nbsp; <span class="lbl">Clips</span>
        <code>${t.clips.map(c => String(c).padStart(3,'0')).join(' ')}</code>
        <details class="film"><summary>Show ${t.clips.length} frames</summary>
          <div class="films">${t.clips.map(c => {
            const p = plays[String(c)]; if(!p) return '';
            return `<figure class="film">
              <img src="frames/${esc(p.image)}" alt="Pre-snap frame, clip ${c}" loading="lazy">
              <figcaption><b>${esc(p.call || '—')}</b>
                Clip ${String(c).padStart(3,'0')} &middot; G${p.game} #${esc(p.playno||'?')}<br>
                ${esc(p.dn)}&amp;${esc(p.dist)} &middot; ${esc(p.gain||0)} yd
                &middot; ${esc(p.gap ? p.gap + ' gap' : p.type)}</figcaption></figure>`;
          }).join('')}</div></details>
      </div>
    </article>`;

    app.className = '';
    app.innerHTML = `
      <section class="call">
        <div class="callhead">The read &mdash; holds in all three games</div>
        <div class="steps">
          <div class="step">
            <div class="steplab">1 &middot; See</div>
            <div class="stepbig">Two backs,<br>no tight end</div>
            ${playCard('20', 'RIGHT')}
            <p class="pccap">Shaded: the two B gaps. Line and backfield are exact;
              receiver splits vary by snap.</p>
            <div class="stepsub">20 personnel &mdash; ${p20.run.n} snaps on film.<br>
              Count the backs; you do not need the formation name.</div>
          </div>
          <div class="arrow" aria-hidden="true">&rarr;</div>
          <div class="step">
            <div class="steplab">2 &middot; Expect</div>
            <div class="stepbig run">${pc(p20.run.rate)} run</div>
            <div class="stepsub">${p20.run.k} of ${p20.run.n}, against a ${pc(base)} base rate.<br>
              ${falcon.run.n} of those ${p20.run.n} were Falcon, and those ran
              ${pc(falcon.run.rate)}.</div>
          </div>
          <div class="arrow" aria-hidden="true">&rarr;</div>
          <div class="step">
            <div class="steplab">3 &middot; Fit</div>
            <div class="stepbig run">B gap</div>
            <div class="stepsub">${pc(g.gap.runs.rate)} of their runs
              (${g.gap.runs.k}/${g.gap.runs.n}).<br>
              Only ${pc((Object.fromEntries(g.gap.pass_spread).B||0) /
                g.gap.pass_spread.reduce((a,[,v])=>a+v,0))} of passes go there.</div>
          </div>
        </div>
        <div class="kicker">Sharpest version: <b>Falcon with the back set right</b> went
          <b>${fbr.run.k}-for-${fbr.run.n} run</b>, and <b>${fbr.bgap_of_runs.k} of those
          ${fbr.bgap_of_runs.n}</b> hit B gap. Small sample &mdash; it appeared in two of the
          three games &mdash; so treat it as a lean, not a lock.</div>
      </section>

      <h2 class="sec">Pre-snap triggers</h2>
      <p class="lede">Ordered by how often you will actually see the look. The bar is the run
        rate, the thin line its 95% interval, the dashed line their ${pc(base)} base rate. Small
        dots are each game on its own &mdash; every read below points the same way in every game
        it appears in. Note these <b>overlap rather than stack</b>: every Falcon snap is 20
        personnel, so the ${p20.run.n} in the top row already contain the ${falcon.run.n} Falcon
        snaps. The rest are Falcon Strong and one Twins Flex.</p>
      <div class="legend">
        <span class="key"><span class="sw r"></span>Run rate</span>
        <span class="key"><span class="sw b"></span>Base rate (${pc(base)})</span>
        <span class="key">Small dots: each game separately</span>
      </div>
      ${trigs.map(trigRow).join('')}

      <h2 class="sec">Count the backs</h2>
      <p class="lede">The whole read is the backfield. Two backs is the tell; one back is
        the coin flip they run most often. Both cards below are their own personnel
        groupings, drawn to the same scale.</p>
      <div class="compare">
        <div class="cmp">
          <div class="cmphead"><b>Two backs, no tight end</b>
            <span class="cmprate run">82% run</span></div>
          ${playCard('20', 'RIGHT')}
          <p class="pccap">20 personnel &middot; 28 snaps &middot; 88 / 60 / 83% by game.
            Shaded: the B gaps, where 80% of their runs go.</p>
        </div>
        <div class="cmp">
          <div class="cmphead"><b>One back, no tight end</b>
            <span class="cmprate flat">47% run</span></div>
          ${playCard('10', 'RIGHT')}
          <p class="pccap">10 personnel &middot; 38 snaps &middot; 54 / 33 / 47% by game.
            Their most common look, and it tells you nothing. Play it straight.</p>
        </div>
      </div>

      <h2 class="sec">Where the run goes</h2>
      <p class="lede">This is the other half of the read, and it is not conditional on anything
        &mdash; it is simply where they run. Passes go somewhere else entirely, which is what
        makes the split useful.</p>
      <div class="legend">
        <span class="key"><span class="sw r"></span>Share of runs (${g.gap.runs.n} tagged)</span>
        <span class="key"><span class="sw p"></span>Share of passes</span>
      </div>
      <div class="gapbox">
        ${gapChart(g.gap)}
        <p class="gapnote"><b>B gap is ${pc(g.gap.runs.rate)} of their runs and
          ${pc((Object.fromEntries(g.gap.pass_spread).B||0) /
             g.gap.pass_spread.reduce((a,[,v])=>a+v,0))} of their passes.</b>
          The pass game lives in D and E-Alley. If the ball is inside, it is a run.</p>
        <p class="gapnote"><b>Watch the trend.</b> B gap was
          ${pc(g.gap.per_game['1'].rate)} of runs in game 1
          (${g.gap.per_game['1'].k}/${g.gap.per_game['1'].n}) but
          ${pc(g.gap.per_game['2'].rate)} and ${pc(g.gap.per_game['3'].rate)} in games 2 and 3.
          If that film is in date order they are already widening it, and the number you should
          plan against is nearer two thirds than nine tenths.</p>
        <div class="tablewrap">
          <table>
            <caption class="printonly" style="text-align:left;padding:6px 10px;font-size:10pt">
              Gap distribution</caption>
            <thead><tr><th>Gap</th><th class="num">Runs</th><th class="num">% of runs</th>
              <th class="num">Passes</th><th class="num">% of passes</th></tr></thead>
            <tbody>${['A','B','C','D','E-Alley'].map(c => {
              const rM = Object.fromEntries(g.gap.run_spread);
              const pM = Object.fromEntries(g.gap.pass_spread);
              const rT = g.gap.run_spread.reduce((a,[,v])=>a+v,0);
              const pT = g.gap.pass_spread.reduce((a,[,v])=>a+v,0);
              return `<tr><td>${c}</td><td class="num">${rM[c]||0}</td>
                <td class="num">${pc((rM[c]||0)/rT)}</td><td class="num">${pM[c]||0}</td>
                <td class="num">${pc((pM[c]||0)/pT)}</td></tr>`;
            }).join('')}</tbody>
          </table>
        </div>
      </div>

      <h2 class="sec">Do not coach these</h2>
      <p class="lede">Each of these was tested the same way as the reads above and came back
        empty. Worth knowing so nobody spends Thursday installing a check for a tell that is
        not there.</p>
      <div class="nots">
        ${g.no_tell.map(n => `<div class="not">
          <span class="verdict">No tell found</span>
          <h3>${esc(n.q)}</h3>
          <p>${esc(n.detail)}<span class="b">${esc(n.base)}</span></p>
        </div>`).join('')}
      </div>

      <div class="cav">
        <h3>Before you lean on this</h3>
        <ul>${g.caveats.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      </div>`;

    // hover layer
    const tip = document.createElement('div');
    tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
    app.addEventListener('pointerover', e => {
      const t = e.target.closest('[data-tip]'); if(!t) return;
      tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
    });
    app.addEventListener('pointermove', e => {
      if(tip.hidden) return;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
      tip.style.top  = Math.max(8, e.clientY - tip.offsetHeight - 14) + 'px';
    });
    app.addEventListener('pointerout', e => {
      if(e.target.closest('[data-tip]')) tip.hidden = true;
    });
  }
})();
</script>
