<meta charset="utf-8">
<title>Grace Prep Call Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#EDEFEA; --card:#FAFBF7; --sunk:#E1E5DD; --rule:#CCD2C9;
    --ink:#121810; --ink-2:#47513F; --ink-3:#77817A;
    --run:#BE5A2E; --pass:#0F7DA8;
    --run-soft:#F5E2D7; --pass-soft:#D7E9F2;
    --stop:#8A2F1E; --stop-soft:#F3DDD7;
    --grid:#D6DBD3;
    --display:"Saira Condensed","Arial Narrow",sans-serif;
    --body:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0B100D; --card:#141A16; --sunk:#090E0B; --rule:#252F29;
      --ink:#E9EEE8; --ink-2:#A6B0A6; --ink-3:#717B73;
      --run:#D4703E; --pass:#3E9BCC;
      --run-soft:#2C1A11; --pass-soft:#0E2430;
      --stop:#DE7C63; --stop-soft:#2E1712;
      --grid:#222B25;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B100D; --card:#141A16; --sunk:#090E0B; --rule:#252F29;
    --ink:#E9EEE8; --ink-2:#A6B0A6; --ink-3:#717B73;
    --run:#D4703E; --pass:#3E9BCC;
    --run-soft:#2C1A11; --pass-soft:#0E2430;
    --stop:#DE7C63; --stop-soft:#2E1712;
    --grid:#222B25;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
       font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding-inline:20px;padding-block:26px 64px}

  /* ---------- masthead ---------- */
  header{border-bottom:3px solid var(--ink);padding-bottom:14px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--ink-3);margin:0 0 4px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(38px,8vw,66px);line-height:.9;
     margin:0;text-transform:uppercase;letter-spacing:-.005em}
  .subhead{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin:8px 0 0}
  .intro{font-size:17px;color:var(--ink-2);margin:12px 0 0;max-width:60ch;line-height:1.55}
  .intro b{color:var(--ink)}

  /* ---------- the one read ---------- */
  .call{margin:26px 0 0;border:3px solid var(--ink);border-radius:5px;overflow:hidden;
        background:var(--card)}
  .callhead{background:var(--ink);color:var(--ground);padding:9px 18px;
            font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .steps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch}
  @media (max-width:760px){ .steps{grid-template-columns:1fr} }
  .step{padding:22px 20px 20px;min-width:0}
  .steplab{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--ink-3);margin-bottom:9px}
  .stepbig{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.92;
           font-size:clamp(30px,5.4vw,46px);letter-spacing:-.005em}
  .stepbig.run{color:var(--run)}
  .stepsub{font-size:15.5px;color:var(--ink-2);margin-top:10px;line-height:1.55}
  .stepsub b{color:var(--ink)}
  .arrow{display:flex;align-items:center;justify-content:center;padding:0 6px;
         color:var(--ink-3);font-size:34px;line-height:1}
  @media (max-width:760px){
    .arrow{padding:0 20px 8px;justify-content:flex-start;transform:rotate(90deg);
           transform-origin:left center;height:26px}
    .step{padding-top:12px}
    .step:first-child{padding-top:22px}
  }
  .kicker{border-top:1px solid var(--rule);background:var(--sunk);padding:14px 18px;
          font-size:16px;color:var(--ink-2)}
  .kicker b{color:var(--ink)}

  /* ---------- alignment cards ---------- */
  .pcard{display:block;width:100%;max-width:380px;height:auto;margin:14px 0 6px}
  .pc-los{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 4}
  .pc-dot{stroke:var(--card);stroke-width:1.5}
  .pc-ol{fill:var(--ink-2)}
  .pc-qb{fill:var(--ink)}
  .pc-rb{fill:var(--run)}
  .pc-wr{fill:var(--ink-3)}
  .pc-te{fill:var(--pass)}
  .pc-lab{font-family:var(--mono);font-size:8px;font-weight:600;fill:var(--card)}
  .pc-gap{font-family:var(--mono);font-size:10px;font-weight:600;fill:var(--run)}
  .pc-bgap{fill:var(--run);opacity:.14}
  .cap{font-size:14px;color:var(--ink-3);line-height:1.5;margin:0 0 2px}
  .cap b{color:var(--ink-2)}

  /* ---------- sections ---------- */
  h2.sec{font-family:var(--display);font-size:clamp(26px,4.2vw,36px);text-transform:uppercase;
         margin:44px 0 4px;letter-spacing:.01em}
  p.lede{margin:0 0 18px;color:var(--ink-2);max-width:62ch;font-size:16.5px}

  /* ---------- sharper reads ---------- */
  .read{background:var(--card);border:1px solid var(--rule);border-radius:4px;
        margin-bottom:12px;overflow:hidden;break-inside:avoid}
  .read.top{border-color:var(--run);border-width:1px 1px 1px 5px}
  .rtop{display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:center;
        padding:16px 18px 12px}
  @media (max-width:640px){ .rtop{grid-template-columns:1fr} }
  .rname{font-family:var(--display);font-weight:600;font-size:26px;text-transform:uppercase;
         line-height:1.05}
  .rwhen{font-size:14.5px;color:var(--ink-3);margin-top:3px}
  .rbig{font-family:var(--display);font-weight:700;font-size:44px;color:var(--run);
        line-height:.95;white-space:nowrap;text-align:right}
  @media (max-width:640px){ .rbig{text-align:left} }
  .rbig span{font-family:var(--body);font-weight:600;font-size:16px;display:block;
             color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
  .rbar{padding:0 18px 4px}
  .rbar svg{display:block;width:100%;max-width:520px;height:auto}
  .rb-band{fill:var(--run);opacity:.20}
  .rb-bar{fill:var(--run)}
  .rb-track{fill:var(--grid)}
  .rrange{padding:0 18px 14px;font-size:14.5px;color:var(--ink-3)}
  .rfoot{border-top:1px solid var(--rule);padding:11px 18px 13px;background:var(--sunk);
         font-size:14px;color:var(--ink-3)}
  .rfoot code{font-family:var(--mono);font-size:13px;color:var(--ink-2);word-break:break-word}
  .rfoot .lbl{font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase;
              font-size:11px}
  details.film{margin-top:9px}
  details.film summary{cursor:pointer;font-size:13.5px;color:var(--ink-2)}
  details.film summary:hover{color:var(--ink)}
  .films{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;
         margin-top:11px}
  .film{border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card)}
  .film img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
  .film figcaption{padding:6px 8px;font-size:11.5px;color:var(--ink-3);line-height:1.45}
  .film figcaption b{display:block;color:var(--ink);font-size:13px}

  /* ---------- side-by-side cards ---------- */
  .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .box{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:4px;
       padding:16px 18px 14px;break-inside:avoid}
  .box svg{display:block;width:100%;height:auto;margin:4px 0 6px}
  .boxhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
           gap:6px 14px;margin-bottom:4px}
  .boxhead b{font-family:var(--display);font-weight:600;font-size:23px;text-transform:uppercase;
             line-height:1.1}
  .tag{font-family:var(--display);font-weight:700;font-size:24px;white-space:nowrap}
  .tag.run{color:var(--run)}
  .tag.flat{color:var(--ink-3)}

  /* ---------- gap diagram ---------- */
  .gf-los{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:6 5}
  .gf-ol{fill:var(--ink-2);stroke:var(--card);stroke-width:1.5}
  .gf-qb{fill:var(--ink);stroke:var(--card);stroke-width:1.5}
  .gf-rb{fill:var(--ink-2);stroke:var(--card);stroke-width:1.5}
  .gf-gap{font-family:var(--mono);font-size:13px;font-weight:600;fill:var(--ink-3)}
  .gf-gap.hot{fill:var(--ink);font-size:16px}

  /* ---------- their calls ---------- */
  table.calls{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 10px}
  table.calls th{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:left;
    padding:6px 8px;border-bottom:1px solid var(--rule)}
  table.calls td{padding:8px;border-bottom:1px solid var(--rule)}
  table.calls tr:last-child td{border-bottom:0}
  table.calls td.c{font-family:var(--mono);font-size:14px;color:var(--ink);
                   word-break:break-word}
  table.calls td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;
                   color:var(--ink-2)}
  table.calls td.g{font-family:var(--display);font-weight:700;font-size:19px;color:var(--run)}

  /* ---------- callout ---------- */
  .heads{margin-top:18px;background:var(--stop-soft);border:1px solid var(--rule);
         border-left:5px solid var(--stop);border-radius:4px;padding:16px 18px;
         break-inside:avoid}
  .heads h3{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0 0 6px;
            color:var(--stop)}
  .heads p{margin:0;font-size:16px;color:var(--ink-2)}
  .heads p b{color:var(--ink)}

  /* ---------- don't coach these ---------- */
  .nots{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
  .not{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--stop);
       border-radius:4px;padding:15px 17px;break-inside:avoid}
  .not h3{font-family:var(--display);font-size:22px;text-transform:uppercase;margin:0 0 6px;
          line-height:1.05}
  .not p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.5}
  .not .b{display:block;margin-top:8px;font-size:14px;color:var(--ink-3)}

  /* ---------- checked / caveats ---------- */
  .checked{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .chk{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:15px 17px;
       break-inside:avoid}
  .chk.ok{border-left:5px solid var(--run)}
  .chk.fix{border-left:5px solid var(--stop)}
  .chklab{font-family:var(--display);font-size:21px;text-transform:uppercase;margin-bottom:8px}
  .chk.fix .chklab{color:var(--stop)}
  .chk ul{margin:0;padding-left:20px}
  .chk li{font-size:15px;color:var(--ink-2);margin-bottom:9px;line-height:1.5}
  .chk li:last-child{margin-bottom:0}
  .cav{margin-top:18px;background:var(--card);border:1px solid var(--rule);border-radius:4px;
       padding:16px 18px;break-inside:avoid}
  .cav h3{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0 0 10px}
  .cav ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:15.5px}
  .cav li{margin-bottom:8px} .cav li:last-child{margin-bottom:0}
  .cav b{color:var(--ink)}

  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--ground);
       font-family:var(--body);font-size:13px;padding:7px 10px;border-radius:4px;z-index:40;
       max-width:250px;line-height:1.45}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-3);font-family:var(--mono)}
  :focus-visible{outline:3px solid var(--run);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- print: for the box or a call-sheet sleeve ---------- */
  @media print{
    :root{--ground:#fff;--card:#fff;--sunk:#f4f4f2;--rule:#bbb;--ink:#000;--ink-2:#333;
          --ink-3:#555;--grid:#ddd}
    body{background:#fff;font-size:11.5pt}
    .wrap{max-width:none;padding:0}
    h2.sec{margin-top:22px;page-break-after:avoid}
    .read,.not,.cav,.box,.call,.chk,.heads{page-break-inside:avoid}
    details.film{display:none}
    .tip{display:none}
  }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Which reads hold up &middot; Grace Prep</p>
    <h1>Grace Prep Call Sheet</h1>
    <p class="intro">Your breakdown already tells you what Grace Prep did. This tells you
      which of it they will do again. We put <b>100 possible reads</b> through the same
      test and <b>six</b> came out the other side.</p>
    <p class="subhead" id="stamp"></p>
  </header>

  <div id="app" class="loading">Loading the sheet&hellip;</div>
</div>

<script>
(function(){
  const app = document.getElementById('app');
  fetch('gameplan.json').then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(build).catch(e => { app.textContent = 'Could not load gameplan.json (' + e + ')'; });

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pc = v => Math.round(v * 100) + '%';

  // ---- run-rate bar -------------------------------------------------------------
  // The old version drew a confidence whisker, a base-rate line and a dot per game on
  // one axis. That is four ideas a coach has to decode. Here the bar is the rate and
  // the pale band behind it is the range the film can actually support; the range is
  // also written out in words underneath, so nobody has to read a chart at all.
  const BW = 520, BH = 34;
  function rateBar(r){
    const x = v => 3 + v * (BW - 6);
    const y = 8, h = 18;
    return `<svg viewBox="0 0 ${BW} ${BH}" role="img"
        aria-label="${pc(r.rate)} run on ${r.n} snaps; on this much film the true rate
                    could sit anywhere from ${pc(r.lo)} to ${pc(r.hi)}">
      <rect class="rb-track" x="3" y="${y}" width="${BW-6}" height="${h}" rx="9"></rect>
      <rect class="rb-band" x="${x(r.lo).toFixed(1)}" y="${y}"
        width="${(x(r.hi)-x(r.lo)).toFixed(1)}" height="${h}" rx="9"
        data-tip="On ${r.n} snaps of film the real number could be anywhere in here"></rect>
      <rect class="rb-bar" x="3" y="${y+4}" width="${(x(r.rate)-3).toFixed(1)}"
        height="${h-8}" rx="5"
        data-tip="${r.k} of ${r.n} snaps were runs"></rect>
    </svg>`;
  }

  // ---- gap diagram: where the ball goes, drawn on the line -----------------------
  // Arrow weight is the share of plays through that gap. Both sides are drawn at the
  // same weight on purpose: the film tells us which gap, never which side.
  const GW = 440, GH = 200, G_LOS = 112, G_MID = 220, G_OL = 28;
  function gapField(spread, total, tone, label){
    const map = Object.fromEntries(spread);
    const gaps = [['A', 0.5], ['B', 1.5], ['C', 2.5], ['D', 3.5], ['E-Alley', 4.6]];
    const ol = [-2,-1,0,1,2].map(i => G_MID + i * G_OL);
    const maxShare = Math.max(...gaps.map(([g]) => (map[g] || 0) / total), 0.01);

    const arrows = gaps.flatMap(([g, step]) => {
      const share = (map[g] || 0) / total;
      if (share <= 0) return [];
      const w = 2.5 + 15 * (share / maxShare);
      return [-1, 1].map(side => {
        const gx = G_MID + side * step * G_OL;
        const sx = G_MID + side * step * G_OL * 0.30;
        const ex = gx + side * step * G_OL * 0.16;
        const ey = G_LOS - 40;
        const ang = Math.atan2(ey - (G_LOS + 46), ex - sx);
        const hl = 8 + w * 0.5;
        const head = [
          [ex + Math.cos(ang) * hl, ey + Math.sin(ang) * hl],
          [ex + Math.cos(ang + 2.5) * hl, ey + Math.sin(ang + 2.5) * hl],
          [ex + Math.cos(ang - 2.5) * hl, ey + Math.sin(ang - 2.5) * hl],
        ].map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
        return `<g data-tip="${g} gap: ${map[g]} of ${total} ${label}${
              side === -1 ? ' — could be either side' : ''}">
          <line x1="${sx.toFixed(1)}" y1="${(G_LOS + 46).toFixed(1)}"
            x2="${ex.toFixed(1)}" y2="${ey}" stroke="var(--${tone})"
            stroke-width="${w.toFixed(1)}" stroke-linecap="round" opacity=".88"></line>
          <polygon points="${head}" fill="var(--${tone})" opacity=".88"></polygon>
        </g>`;
      });
    }).join('');

    const gapLabels = gaps.flatMap(([g, step]) => [-1, 1].map(side => {
      const gx = G_MID + side * step * G_OL;
      const share = (map[g] || 0) / total;
      return `<text class="gf-gap${share >= 0.25 ? ' hot' : ''}" x="${gx.toFixed(1)}"
        y="${G_LOS + 27}" text-anchor="middle">${g === 'E-Alley' ? 'E' : g}</text>`;
    })).join('');

    return `<svg viewBox="0 0 ${GW} ${GH}" role="img"
        aria-label="Where their ${label} go, drawn on the offensive line. ${
          gaps.filter(([g]) => map[g]).map(([g]) =>
            `${g} gap ${pc((map[g]||0)/total)}`).join(', ')}. Both sides are shown because
          the film records the gap, not the side.">
      <line class="gf-los" x1="14" y1="${G_LOS}" x2="${GW - 14}" y2="${G_LOS}"></line>
      ${arrows}
      ${ol.map(x => `<circle class="gf-ol" cx="${x}" cy="${G_LOS}" r="8"></circle>`).join('')}
      <circle class="gf-qb" cx="${G_MID}" cy="${G_LOS + 30}" r="7"></circle>
      <circle class="gf-rb" cx="${G_MID}" cy="${G_LOS + 62}" r="7"></circle>
      ${gapLabels}
    </svg>`;
  }

  // ---- alignment card -----------------------------------------------------------
  // Drawn from the personnel count: first digit is backs, second is tight ends, the
  // rest are receivers. Line and backfield are exact; receiver splits move snap to
  // snap, which the caption says out loud.
  const CARD_W = 330, CARD_H = 172, LOS_Y = 74, MID = 165, OL_GAP = 23;
  function playCard(pers, backfield){
    const rb = +String(pers)[0], te = +String(pers)[1];
    const wr = Math.max(0, 5 - rb - te);
    const ol = [-2,-1,0,1,2].map(i => MID + i * OL_GAP);
    const dot = (x, y, cls, lab) =>
      `<circle class="pc-dot ${cls}" cx="${x.toFixed(1)}" cy="${y}" r="7"></circle>` +
      (lab ? `<text class="pc-lab" x="${x.toFixed(1)}" y="${y + 3.4}"
                text-anchor="middle">${lab}</text>` : '');

    const bGaps = [(ol[0] + ol[1]) / 2, (ol[3] + ol[4]) / 2].map(x =>
      `<rect class="pc-bgap" x="${(x - 9).toFixed(1)}" y="${LOS_Y - 26}"
         width="18" height="52" rx="3"></rect>
       <text class="pc-gap" x="${x.toFixed(1)}" y="${LOS_Y - 32}"
         text-anchor="middle">B</text>`).join('');

    const qbY = LOS_Y + 26;
    const side = backfield === 'LEFT' ? -1 : 1;
    const slots = backfield === 'PISTOL'
        ? [[MID, qbY + 30, 'RB'], [MID - 26, qbY + 30, 'RB'], [MID + 26, qbY + 30, 'RB']]
      : backfield === 'WISHBONE'
        ? [[MID, qbY + 26, 'FB'], [MID - 34, qbY + 46, 'RB'], [MID + 34, qbY + 46, 'RB']]
      : (backfield === 'ONE BACK' || rb === 1)
        ? [[MID, qbY + 28, 'RB'], [MID + 32, qbY + 12, 'RB'], [MID - 32, qbY + 12, 'RB']]
        : [[MID + side * 30, qbY + 14, 'RB'], [MID - side * 14, qbY + 32, 'RB'],
           [MID + side * 4, qbY + 48, 'RB']];
    const backs = slots.slice(0, rb);

    const wrX = [MID - 138, MID - 112, MID + 112, MID + 138, MID - 86];
    const recv = Array.from({length: wr}, (_, i) =>
      dot(wrX[i], LOS_Y, 'pc-wr', 'W')).join('');
    const tight = Array.from({length: te}, (_, i) =>
      dot(ol[4] + 24 + i * 22, LOS_Y, 'pc-te', 'Y')).join('');

    return `<svg class="pcard" viewBox="0 0 ${CARD_W} ${CARD_H}" role="img"
        aria-label="${rb} back${rb===1?'':'s'}, ${te} tight end${te===1?'':'s'},
                    ${wr} receivers. Shaded strips are the B gaps, between guard and tackle
                    on each side.">
      <line class="pc-los" x1="6" y1="${LOS_Y}" x2="${CARD_W - 6}" y2="${LOS_Y}"></line>
      ${bGaps}
      ${ol.map(x => dot(x, LOS_Y, 'pc-ol', '')).join('')}
      ${tight}${recv}
      ${dot(MID, qbY, 'pc-qb', 'Q')}
      ${backs.map(([x, y, l]) => dot(x, y, 'pc-rb', l)).join('')}
    </svg>`;
  }

  function build(g){
    const plays = g.plays;
    const all = Object.values(plays);
    const base = all.filter(p => p.type === 'Run').length / all.length;
    const pTot = g.gap.pass_spread.reduce((a,[,v]) => a + v, 0);
    const passB = (Object.fromEntries(g.gap.pass_spread).B || 0);

    document.getElementById('stamp').textContent =
      'Grace Prep Academy · ' + all.length + ' offensive snaps from 3 games of film';

    const p20    = g.triggers.find(t => t.name === '20 personnel');
    const p20r   = g.triggers.find(t => t.name === '20 personnel, back right');
    const falcon = g.triggers.find(t => t.name === 'FALCON');
    const flong  = g.triggers.find(t => t.name === 'FALCON on 8+ to go');
    const passSeries20 = (g.series && g.series.by_pers && g.series.by_pers['20'] || {}).pass_series || 0;

    const hudl = clips => [1,2,3].map(gm => {
      const inG = clips.map(c => plays[String(c)]).filter(p => p && p.game === gm);
      if(!inG.length) return '';
      return `Game ${gm} <code>#${inG.map(p => esc(p.playno || '?')).join(', #')}</code>`;
    }).filter(Boolean).join(' &nbsp; ');

    // Three reads, widest first. They are the SAME plays looked at more narrowly, not
    // three separate pieces of evidence, and the lede says so.
    const reads = [
      {t: p20,   name: 'Two backs, no tight end',
       when: 'Any time they put two backs in the backfield'},
      {t: p20r,  name: 'Two backs, back set right',
       when: 'Two backs with the ball-carrier lined up to the right'},
      {t: flong, name: 'Two backs on 8+ to go',
       when: 'Second or third down, long yardage, two backs'},
    ].filter(r => r.t);

    const readRow = (r, i) => `<article class="read${i===0?' top':''}">
      <div class="rtop">
        <div>
          <div class="rname">${esc(r.name)}</div>
          <div class="rwhen">${esc(r.when)}</div>
        </div>
        <div class="rbig">${pc(r.t.run.rate)}<span>run</span></div>
      </div>
      <div class="rbar">${rateBar(r.t.run)}</div>
      <p class="rrange">Ran it <b>${r.t.run.k} times out of ${r.t.run.n}</b>.
        On this much film the real number could be as low as ${pc(r.t.run.lo)} or as high as
        ${pc(r.t.run.hi)} &mdash; and <b>${r.t.bgap_of_runs.k} of those ${r.t.bgap_of_runs.n} runs
        hit B gap</b>.</p>
      <div class="rfoot">
        <span class="lbl">Check it on film &mdash;</span> ${hudl(r.t.clips)}
        <details class="film"><summary>Show the ${r.t.clips.length} snaps</summary>
          <div class="films">${r.t.clips.map(c => {
            const p = plays[String(c)]; if(!p) return '';
            return `<figure class="film">
              <img src="frames/${esc(p.image)}" alt="Pre-snap look, clip ${c}" loading="lazy">
              <figcaption><b>${esc(p.call || '—')}</b>
                Clip ${String(c).padStart(3,'0')} &middot; Game ${p.game} #${esc(p.playno||'?')}<br>
                ${esc(p.dn)} &amp; ${esc(p.dist)} &middot; ${esc(p.gain||0)} yards
                ${p.gap ? '&middot; ' + esc(p.gap) + ' gap' : ''}</figcaption></figure>`;
          }).join('')}</div></details>
      </div>
    </article>`;

    app.className = '';
    app.innerHTML = `
      <section class="call">
        <div class="callhead">The read &mdash; it showed up in all three games</div>
        <div class="steps">
          <div class="step">
            <div class="steplab">1 &middot; See</div>
            <div class="stepbig">Two backs,<br>no tight end</div>
            ${playCard('20', 'RIGHT')}
            <div class="stepsub">Count the backs. You do not need the formation name.
              <b>${p20.run.n} snaps</b> of this on film.</div>
          </div>
          <div class="arrow" aria-hidden="true">&rarr;</div>
          <div class="step">
            <div class="steplab">2 &middot; Expect</div>
            <div class="stepbig run">Run</div>
            <div class="stepsub">They ran it <b>${p20.run.k} of ${p20.run.n} times</b>.
              Two backs is not just a lean &mdash; it puts them in their run package.
              Only <b>${passSeries20}</b> of those snaps came out of their pass series.</div>
          </div>
          <div class="arrow" aria-hidden="true">&rarr;</div>
          <div class="step">
            <div class="steplab">3 &middot; Fit</div>
            <div class="stepbig run">B gap</div>
            <div class="stepsub">Between guard and tackle.
              <b>${g.gap.runs.k} of their ${g.gap.runs.n} runs</b> went there.
              Passes almost never do &mdash; only ${passB} of ${pTot}.</div>
          </div>
        </div>
        <div class="kicker">Downhill power out of two backs, behind a pulling guard.
          If you see two backs and no tight end, get your fits right in the B gap and make
          them prove they can do something else.</div>
      </section>

      <h2 class="sec">The read, tightened up</h2>
      <p class="lede">Same read, narrowed down. These are <b>not three separate things</b> &mdash;
        they are the same snaps looked at more closely, so the numbers overlap. The more you
        narrow it, the stronger it looks and the less film it rests on.</p>
      ${reads.map(readRow).join('')}

      <h2 class="sec">Count the backs</h2>
      <p class="lede">The whole read is the backfield. Two backs is the tell. One back is the
        look they use most, and it tells you nothing &mdash; so do not guess on it.</p>
      <div class="pair">
        <figure class="box">
          <figcaption class="boxhead"><b>Two backs</b>
            <span class="tag run">Run</span></figcaption>
          ${playCard('20', 'RIGHT')}
          <p class="cap"><b>${p20.run.n} snaps.</b> Ran it ${p20.run.k} times.
            Held up in all three games. Shaded strips are the B gaps.</p>
        </figure>
        <figure class="box">
          <figcaption class="boxhead"><b>One back</b>
            <span class="tag flat">Coin flip</span></figcaption>
          ${playCard('10', 'RIGHT')}
          <p class="cap"><b>38 snaps</b> &mdash; their most common look, and it ran about
            half the time in every game. Play it straight.</p>
        </figure>
      </div>

      <h2 class="sec">Where the run goes</h2>
      <p class="lede">Not conditional on anything. This is simply where they run it, whatever
        they line up in. Arrow thickness is how often.</p>
      <div class="pair">
        <figure class="box">
          <figcaption class="boxhead"><b>Their runs</b>
            <span class="tag run">${pc(g.gap.runs.rate)} B gap</span></figcaption>
          ${gapField(g.gap.run_spread, g.gap.runs.n, 'run', 'runs')}
          <p class="cap">Four out of five runs come between guard and tackle.
            Both sides are drawn the same because <b>the film tells us the gap, never the
            side</b>.</p>
        </figure>
        <figure class="box">
          <figcaption class="boxhead"><b>Their run calls</b>
            <span class="tag run">${(g.series.menu||[]).filter(m=>m.runs>=3)
              .reduce((a,m)=>a+m.runs,0)} runs</span></figcaption>
          <table class="calls">
            <thead><tr><th>Their call</th><th class="n">Times</th><th>Gap</th></tr></thead>
            <tbody>${(g.series.menu||[]).filter(m => m.runs >= 3)
              .sort((a,b) => b.runs - a.runs).slice(0, 5).map(m => `<tr>
                <td class="c">${esc(m.calls.slice(0,2).join(', '))}</td>
                <td class="n">${m.runs}</td>
                <td class="g">${m.gaps.length ? esc(m.gaps[0][0]) : '&mdash;'}</td>
              </tr>`).join('')}</tbody>
          </table>
          <p class="cap">Odd numbers go left, even go right &mdash; their own numbering.
            <b>G</b> means a guard pulls, <b>GF</b> adds the fullback. Straight-ahead
            gap-scheme power.</p>
        </figure>
      </div>

      <div class="heads">
        <h3>Heads up &mdash; they may be widening it out</h3>
        <p>B gap was <b>${pc(g.gap.per_game['1'].rate)}</b> of their runs in the first game
          but only <b>${pc(g.gap.per_game['2'].rate)}</b> and
          <b>${pc(g.gap.per_game['3'].rate)}</b> in the next two. If that film is in date
          order they are already getting away from it. <b>Plan against two thirds, not nine
          tenths</b> &mdash; keep your edges honest.</p>
      </div>

      <h2 class="sec">Do not coach these</h2>
      <p class="lede">We looked hard for each of these and came up empty. Worth knowing so
        nobody spends Thursday installing a check for a tell that is not there.</p>
      <div class="nots">
        <div class="not">
          <h3>Which way is it going?</h3>
          <p>Nothing they show before the snap tells you the side. We checked formation,
            personnel, backfield, hash and down &mdash; every one of them came out near
            50/50.<span class="b">They went right on 54% of snaps. That is a coin flip.</span></p>
        </div>
        <div class="not">
          <h3>Is the big one coming?</h3>
          <p>No look tips an explosive play. Nothing about how they line up tells you when
            they are about to break one.<span class="b">About 1 play in 5 gained 12 or more
            yards.</span></p>
        </div>
        <div class="not">
          <h3>Does the look pick the gap?</h3>
          <p>No &mdash; and it does not need to. B gap is where nearly everything goes
            regardless of what they show you, so fit it every time.<span class="b">4 of every
            5 runs on film hit B gap.</span></p>
        </div>
      </div>

      <h2 class="sec">How we checked it</h2>
      <p class="lede">A report can show a read that happened four times in one game and
        never again. Every read here had to clear three bars: enough snaps to mean
        something, a margin bigger than luck explains, and <b>the same answer in every
        game it showed up in</b>. That last one killed most of them. We also checked the
        tags themselves against the film before trusting any of it.</p>
      <div class="checked">
        <div class="chk ok">
          <div class="chklab">What held up</div>
          <ul>
            <li><b>Their own play numbers agree with the gap tags.</b> Every single
              &ldquo;4&rdquo; call is marked B gap, and 15 of 17 &ldquo;3&rdquo; calls are
              too. Two separate records telling the same story.</li>
            <li><b>We pulled one up on film.</b> Clip 43 is tagged 23 G, B gap, to the left.
              That is exactly what happens &mdash; back takes it left behind the pull.</li>
            <li><b>Two backs really is a package, not a habit.</b> Only ${passSeries20} of
              those ${p20.run.n} snaps came out of the series they throw from.</li>
          </ul>
        </div>
        <div class="chk fix">
          <div class="chklab">What we took out</div>
          <ul>
            <li><b>A chart of where their passes go.</b> We could not work out what the film
              tag meant on a passing play, so we pulled the chart rather than guess at it.
              What we can say: their passes almost never show up in B gap.</li>
            <li><b>Trust the numbers, not the pictures.</b> Some still frames on this sheet
              may be a moment after the snap instead of before it. The numbers are unaffected
              &mdash; those come straight off the tagged film.</li>
            <li><b>What this angle cannot settle.</b> We went back to the video to check the
              two things this sheet rests on &mdash; that it is really two backs, and that the
              ball really hits B gap. From a sideline camera neither can be confirmed: the
              backfield is foreshortened so an H-back reads like a tight end, and A, B and C
              gap are a few feet apart inside a pile. Run or pass is obvious on film and
              checks out every time. The finer calls come from whoever tagged the game, and
              they are consistent with each other and with their own play numbers &mdash; but
              we are trusting the tagger on those, not the footage. An end zone angle would
              settle both.</li>
          </ul>
        </div>
      </div>

      <div class="cav">
        <h3>Before you lean on this</h3>
        <ul>
          <li><b>It is three games and ${all.length} snaps.</b> That is not a lot. One series
            on Friday can move any of these numbers.</li>
          <li><b>The B gap number is already drifting</b> &mdash; ${pc(g.gap.per_game['1'].rate)}
            in the first game, about two thirds in the other two.</li>
          <li><b>We do not know how old this film is.</b> There are no dates or opponent names
            on it. Worth checking it is this season before you lean on it.</li>
          <li><b>This is read off hand-tagged film</b>, not off video analysis. Somebody
            charted every snap; these are their tags, checked.</li>
        </ul>
      </div>`;

    // hover layer
    const tip = document.createElement('div');
    tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
    app.addEventListener('pointerover', e => {
      const t = e.target.closest('[data-tip]'); if(!t) return;
      tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
    });
    app.addEventListener('pointermove', e => {
      if(tip.hidden) return;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
      tip.style.top  = Math.max(8, e.clientY - tip.offsetHeight - 14) + 'px';
    });
    app.addEventListener('pointerout', e => {
      if(e.target.closest('[data-tip]')) tip.hidden = true;
    });
  }
})();
</script>
